server {
  listen 80;
  server_name front.itformanomberone.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name frontend.limonska.top;

  ssl_certificate /etc/letsencrypt/live/front.itformanomberone.comp/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/front.itformanomberone.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }
}
