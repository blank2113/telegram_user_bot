# HTTP → HTTPS редирект
server {
  listen 80;
  server_name front.itformanomberone.com;
  return 301 https://$host$request_uri;
}

# HTTPS сервер для frontend.limonska.top
server {
  listen 443 ssl;
  server_name frontend.limonska.top;

  ssl_certificate /etc/ssl/cloudflare/api.itformanomberone.com.crt;
  ssl_certificate_key /etc/ssl/cloudflare/api.itformanomberone.com.key;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }
}

