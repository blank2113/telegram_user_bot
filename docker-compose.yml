version: '3.9'

services:
  frontend:
    build: .
    container_name: frontend
    networks:
      - frontend_network
    expose:
      - "80"

  nginx-frontend:
    image: nginx:alpine
    container_name: nginx-frontend
    networks:
      - frontend_network
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend

networks:
  frontend_network:
    driver: bridge
